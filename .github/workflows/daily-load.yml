name: Daily Season Load

# Loads the current season from the CFBD API, refreshes marts, and verifies
# the load. Runs year-round: portal windows (Jan/Apr), signing days (Dec/Feb),
# the NFL draft (Apr), and the coaching carousel all mutate off-season data.
#
# Requires repo secrets:
#   CFBD_API_KEY      - collegefootballdata.com API key
#   SUPABASE_DB_URL   - Supabase SESSION pooler URL (IPv4; the transaction
#                       pooler rejects the statement_timeout startup option
#                       that refresh_marts.py appends)
#   ANTHROPIC_API_KEY - Anthropic API key, used only by the recaps job
#                       (scripts/generate_recaps.py)
#
# The rate limiter's JSON state resets every run (ephemeral runner). That is
# accepted for now (see docs/solutions/best-practices/2026-07-28-cfbd-api-usage-audit.md
# F1). Estimated daily cost against the 125K/month Tier 4 budget
# (.dlt/config.toml): off-season ~730 calls/day (~22K/month, immutable-season
# skip active); in-season worst case ~2,430 calls/day (~73K/month), dominated
# by the per-game /plays/stats fan-out (audit F2).

on:
  schedule:
    - cron: "0 10 * * *" # 10:00 UTC ~ 6:00 AM ET, after all games (incl. Hawaii) complete
  workflow_dispatch:
    inputs:
      season:
        description: "Season year (default: current season)"
        required: false
        type: string
      recap_limit:
        description: "Max games for the recaps job to process (default: MAX_RECAPS_PER_RUN, 30)"
        required: false
        type: string

concurrency:
  group: daily-season-load
  cancel-in-progress: false # never kill a mid-merge load; a queued run waits

permissions:
  contents: read
  issues: write

env:
  PYTHON_VERSION: "3.11"
  SOURCES__CFBD__API_KEY: ${{ secrets.CFBD_API_KEY }}
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

jobs:
  load:
    name: Load season, refresh marts, verify
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[compute]"
      - name: Set dlt destination credentials
        # dlt requires the postgres:// scheme (see .dlt/secrets.toml.example)
        run: echo "DESTINATION__POSTGRES__CREDENTIALS=$(printf '%s' "$SUPABASE_DB_URL" | sed 's/^postgresql:/postgres:/')" >> "$GITHUB_ENV"
      - name: Load season data (includes mart refresh)
        run: |
          if [ -n "${{ inputs.season }}" ]; then
            python scripts/load_season.py --season "${{ inputs.season }}" --weekly
          else
            python scripts/load_season.py --weekly
          fi
      - name: Update house Elo
        run: python scripts/compute_house_elo.py --incremental
      - name: Refit adjusted EPA
        run: |
          if [ -n "${{ inputs.season }}" ]; then
            python scripts/compute_adjusted_epa.py --season "${{ inputs.season }}"
          else
            python scripts/compute_adjusted_epa.py --incremental
          fi
      - name: Update as-of weekly EPA
        run: python scripts/compute_adjusted_epa_week.py --incremental
      - name: Write game predictions
        run: python scripts/compute_predictions.py
      - name: Rebuild feature substrate
        run: python scripts/build_features.py --incremental
      - name: Refit fitted_v1 if stale
        run: python scripts/train_model.py --refit-if-stale
      - name: Score fitted model (upcoming)
        run: python scripts/score_fitted.py --upcoming
      - name: Simulate season projections
        run: python scripts/simulate_season.py
      # Runs DAILY, not annually, even though the measurement only moves on a
      # refit or a feature rebuild. Two reasons. api.model_backtest.run_date is
      # what cfb-app checks to decide whether its cached honesty numbers are
      # stale, and a date that only advances once a year cannot distinguish
      # "still current" from "nobody has run this since January". And because
      # the backtest re-measures against the CURRENT feature substrate, a
      # rebuild that silently changed a column shows up here the next morning
      # instead of at the next annual refit.
      #
      # Cheap (~12s, fixed seed so identical inputs give an identical row) and
      # append-only per day, which is the drift history the table exists for.
      - name: Backtest season projections
        run: python scripts/backtest_preseason.py
      - name: Refresh Tier 2 + Tier 3 marts
        run: python scripts/refresh_marts.py --views marts.house_elo,marts.house_elo_game,marts.team_adjusted_epa,marts.scored_matchup_edges,marts.prediction_accuracy,marts.team_week_features,marts.adjusted_epa_week
      - name: Verify load
        run: |
          if [ -n "${{ inputs.season }}" ]; then
            python scripts/verify_load.py --season "${{ inputs.season }}"
          else
            python scripts/verify_load.py
          fi
      - name: Open or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Daily season load failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            });
            const existing = data.find((i) => i.title === title);
            const body = `Run failed: ${runUrl} (${new Date().toISOString()})`;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

  recaps:
    name: Generate nightly game recaps
    needs: load
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[recaps]"
      - name: Generate recaps
        run: |
          if [ -n "${{ inputs.recap_limit }}" ]; then
            python scripts/generate_recaps.py --limit "${{ inputs.recap_limit }}"
          else
            python scripts/generate_recaps.py
          fi
      - name: Open or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Nightly recap generation failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            });
            const existing = data.find((i) => i.title === title);
            const body = `Run failed: ${runUrl} (${new Date().toISOString()})`;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

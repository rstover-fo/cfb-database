name: Probe 2026 Endpoints

# One-off, manually dispatched probe of CFBD spec v5.24.2 -> v5.25.0's
# new/changed endpoints (playoff bracket, coach seasons/tenures, conference
# affiliation history, player success rate, expanded SRS, player season
# overview, whether two existing endpoints still accept a bare `year`, and
# -- new in v5.25.0 -- the /passing family: play-level passing charting,
# player and team passing splits by game and by season; and -- new in
# v5.26.0 -- the matching /rushing family, probes 19-23). Read-only, ~35
# calls total -- see scripts/probe_2026_endpoints.py for the full list.
# No schedule: run it by hand when a response shape needs to be confirmed
# before writing the corresponding dlt source module.
#
# Requires repo secret:
#   CFBD_API_KEY - collegefootballdata.com API key

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated probe numbers to run, e.g. 4,9,12 (default: all 23)"
        required: false
        type: string

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  probe:
    name: Probe endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e .
      - name: Run endpoint probe
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ONLY_INPUT: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY_INPUT" ]; then
            python scripts/probe_2026_endpoints.py --only "$ONLY_INPUT" | tee probe_stdout.txt
          else
            python scripts/probe_2026_endpoints.py | tee probe_stdout.txt
          fi
      - name: Append summary to job summary
        if: always()
        run: |
          {
            echo '### CFBD endpoint probe results'
            echo '```'
            cat probe_stdout.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-output
          path: probe_output/
          retention-days: 7
          if-no-files-found: warn

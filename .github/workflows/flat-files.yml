name: Flat File Load

# Loads flat-file sources from REGISTRY (massey ratings, nflverse draft/combine,
# SBR historical lines, availability reports). Uses hash-skip ledger (meta.flat_file_loads)
# to avoid re-processing unchanged files; off-cadence manual runs are essentially free.
#
# Requires repo secrets:
#   SUPABASE_DB_URL   - Supabase SESSION pooler URL (IPv4)
#
# Flat-file freshness verification is handled by scripts/verify_load.py inside the
# existing daily-load workflow, after this reusable workflow succeeds.

on:
  workflow_call:
    inputs:
      source:
        description: "Registry source names, space-separated; empty runs --due"
        required: false
        type: string
        default: ""
      seasons:
        description: "Season years, space-separated; empty uses the current loader target"
        required: false
        type: string
        default: ""
      receipt_canary_action:
        description: "Explicit SDV receipt canary action; none preserves the legacy loader"
        required: false
        type: string
        default: "none"
      receipt_expected_sha256:
        description: "Required for a receipt canary; exact reviewed artifact SHA-256"
        required: false
        type: string
        default: ""
    secrets:
      SUPABASE_DB_URL:
        required: true
  workflow_dispatch:
    inputs:
      source:
        description: "Registry source name(s), space-separated; empty = --due"
        required: false
        type: string
      seasons:
        description: >-
          Season years, space-separated (e.g. 2013 2014 2015); empty = run
          once with no --season, today's behavior. Non-empty loops the load
          once per season, appending --season "$season" to the same
          --source-flags-or---due invocation each time. Combining this with
          an empty `source` (so the invocation is --due) is a full
          backfill: an explicit --season disables --due's cadence gating
          and plans every non-manual source for that season -- cadence
          freshness only describes the current season's file, and the
          ledger hash-skip keeps the over-planning cheap. An explicit-season
          request for a year a source hasn't published yet reports
          not_published (see probe_offseason_availability.py's distinction)
          and does not fail the run.
        required: false
        type: string
      receipt_canary_action:
        description: "Explicit SDV receipt canary action"
        required: false
        type: choice
        default: "none"
        options:
          - none
          - preflight
          - publish
      receipt_expected_sha256:
        description: "Required for a receipt canary; exact reviewed artifact SHA-256"
        required: false
        type: string

concurrency:
  group: flat-file-load
  queue: max # preserve every pending flat-file writer instead of replacing one
  cancel-in-progress: false # never kill a mid-merge load; a queued run waits

permissions:
  contents: read
  issues: write

env:
  PYTHON_VERSION: "3.11"
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

jobs:
  load:
    name: Load flat-file sources
    runs-on: ubuntu-latest
    # 30 is enough for a single --due/--source invocation, but a multi-season
    # `seasons` backfill of the 7-source NCAA bundle (ncaa_schedule,
    # ncaa_teams, ncaa_rosters, ncaa_linescores, ncaa_player_stats,
    # ncaa_team_stats, ncaa_pbp -- the last a multi-hundred-thousand-row
    # parquet load) across e.g. 12 seasons needs real headroom.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[flatfiles]"
      - name: Set dlt destination credentials
        # dlt requires the postgres:// scheme (see .dlt/secrets.toml.example)
        run: echo "DESTINATION__POSTGRES__CREDENTIALS=$(printf '%s' "$SUPABASE_DB_URL" | sed 's/^postgresql:/postgres:/')" >> "$GITHUB_ENV"
      - name: Load flat-file sources
        id: load_flat_files
        if: ${{ inputs.receipt_canary_action == 'none' }}
        # Hardening (PR #75 review finding C): route the workflow_dispatch
        # `source` input through a step-level env: var (probe-endpoints.yml's
        # pattern) instead of interpolating ${{ inputs.source }} directly
        # into the run: shell -- see historical-refresh.yml's Drain backlog
        # step for the rationale. Same treatment for `seasons`.
        env:
          SOURCE_INPUT: ${{ inputs.source }}
          SEASONS_INPUT: ${{ inputs.seasons }}
          SDV_FPI_RECEIPT_SEASON: ${{ vars.SDV_FPI_RECEIPT_SEASON }}
          SDV_RATINGS_RECEIPT_SEASON: ${{ vars.SDV_RATINGS_RECEIPT_SEASON }}
          SDV_TEAM_XWALK_RECEIPT_SEASON: ${{ vars.SDV_TEAM_XWALK_RECEIPT_SEASON }}
          SDV_GAME_XWALK_RECEIPT_SEASON: ${{ vars.SDV_GAME_XWALK_RECEIPT_SEASON }}
        run: |
          due_exclusions=()
          if [ "$SDV_FPI_RECEIPT_SEASON" = "2026" ]; then
            due_exclusions+=(--exclude-source-season "sdv_fpi_weekly:2026")
          fi
          case "$SDV_RATINGS_RECEIPT_SEASON" in
            2026) due_exclusions+=(--exclude-source-season "sdv_ratings_weekly:2026") ;;
            "") ;;
            *) echo "::error::SDV_RATINGS_RECEIPT_SEASON must be empty or 2026"; exit 2 ;;
          esac
          # The implicit 2026 fetch can fall back to 2025. Both planned
          # attempts must yield ownership of the receipted 2025 partition.
          case "$SDV_TEAM_XWALK_RECEIPT_SEASON" in
            2025) due_exclusions+=(--exclude-source-season "sdv_team_xwalk:2025" --exclude-source-season "sdv_team_xwalk:2026") ;;
            "") ;;
            *) echo "::error::SDV_TEAM_XWALK_RECEIPT_SEASON must be empty or 2025"; exit 2 ;;
          esac
          case "$SDV_GAME_XWALK_RECEIPT_SEASON" in
            2025) due_exclusions+=(--exclude-source-season "sdv_game_xwalk:2025" --exclude-source-season "sdv_game_xwalk:2026") ;;
            "") ;;
            *) echo "::error::SDV_GAME_XWALK_RECEIPT_SEASON must be empty or 2025"; exit 2 ;;
          esac
          if [ -n "$SEASONS_INPUT" ]; then
            # $SEASONS_INPUT is deliberately unquoted -- it is a
            # space-separated list of years and this loop relies on the
            # shell's word-splitting to iterate them individually (same
            # pattern as backfill-sources.yml's per-season loop).
            for season in $SEASONS_INPUT; do
              echo "::group::Season $season"
              if [ -n "$SOURCE_INPUT" ]; then
                # Deliberately unquoted: SOURCE_INPUT is a space-separated
                # list of registry names, and word-splitting is how each
                # one becomes its own --source flag below.
                python scripts/load_flat_files.py $(printf -- '--source %s ' $SOURCE_INPUT) --season "$season"
              else
                python scripts/load_flat_files.py --due --season "$season" "${due_exclusions[@]}"
              fi
              echo "::endgroup::"
            done
          elif [ -n "$SOURCE_INPUT" ]; then
            # Deliberately unquoted: SOURCE_INPUT is a space-separated list
            # of registry names, and word-splitting is how each one becomes
            # its own --source flag below.
            python scripts/load_flat_files.py $(printf -- '--source %s ' $SOURCE_INPUT)
          else
            python scripts/load_flat_files.py --due "${due_exclusions[@]}"
          fi
      - name: Run source receipt canary
        id: receipt_canary
        if: ${{ inputs.receipt_canary_action != 'none' }}
        env:
          RECEIPT_CANARY_ACTION: ${{ inputs.receipt_canary_action }}
          RECEIPT_CANARY_SOURCE: ${{ inputs.source }}
          RECEIPT_CANARY_SEASON: ${{ inputs.seasons }}
          RECEIPT_EXPECTED_SHA256: ${{ inputs.receipt_expected_sha256 }}
          RECEIPT_EXPECTED_PROJECT_REF: "ibobsbwlewpqslkqbrjd"
        run: |
          python scripts/run_source_receipt_canary.py "$RECEIPT_CANARY_ACTION" \
            --source "$RECEIPT_CANARY_SOURCE" \
            --season "$RECEIPT_CANARY_SEASON" \
            --expected-sha256 "$RECEIPT_EXPECTED_SHA256" \
            --expected-project-ref "$RECEIPT_EXPECTED_PROJECT_REF"
      - name: Refresh canary rating consumers
        # Publication may commit before returning a failed verification or an
        # uncertain result. Refresh those rows without clearing the failure.
        if: ${{ !cancelled() && steps.receipt_canary.outputs.publication_source == 'sdv_ratings_weekly' && steps.receipt_canary.outputs.publication_attempted == 'true' && (steps.receipt_canary.outcome == 'success' || steps.receipt_canary.outcome == 'failure') }}
        run: python scripts/refresh_marts.py --views marts.epa_crossvalidation
      - name: Refresh external-rating consumers
        # A failed multi-source load may still have committed new ratings.
        # Refresh those rows, but preserve the failed load/job status. Skip
        # cancellation and setup failures where the import step never ran.
        if: ${{ inputs.receipt_canary_action == 'none' && !cancelled() && (steps.load_flat_files.outcome == 'success' || steps.load_flat_files.outcome == 'failure') }}
        # Also retry after hash-skips or an empty due plan.
        run: python scripts/refresh_marts.py --views marts.epa_crossvalidation
      - name: Open or update failure issue
        if: ${{ failure() && inputs.receipt_canary_action == 'none' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const title = "Flat-file load failures";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            });
            const existing = data.find((i) => i.title === title);
            const body = `Run failed: ${runUrl} (${new Date().toISOString()})`;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/check_agent_setup.py

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            mcp/pyproject.toml
      - run: ./scripts/setup_dev.sh
      - run: PATH="$PWD/.venv/bin:$PATH" python -m pytest -q --tb=short --live-db
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  mcp:
    name: MCP Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            mcp/pyproject.toml
      - run: ./scripts/setup_dev.sh
      - run: PATH="$PWD/.venv/bin:$PATH" ruff check mcp
      - run: PATH="$PWD/.venv/bin:$PATH" python -m pytest mcp/tests -q --tb=short

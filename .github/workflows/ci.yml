name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/check_agent_setup.py

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            mcp/pyproject.toml
      - run: ./scripts/setup_dev.sh
      - run: PATH="$PWD/.venv/bin:$PATH" python -m pytest -q --tb=short --live-db
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  mcp:
    name: MCP Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            mcp/pyproject.toml
      - run: ./scripts/setup_dev.sh
      - run: PATH="$PWD/.venv/bin:$PATH" ruff check mcp
      - run: PATH="$PWD/.venv/bin:$PATH" python -m pytest mcp/tests -q --tb=short

  prediction-provenance:
    name: Prediction Provenance SQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: ./scripts/setup_dev.sh
      - run: .venv/bin/python -m pytest tests/test_prediction_provenance_sql.py -q --tb=short
        env:
          F04_TEST_DB_URL: postgresql://postgres@127.0.0.1:5432/postgres
      - name: Training registry SQL
        run: .venv/bin/python -m pytest tests/test_training_registry_sql.py -q --tb=short
        env:
          F05_TEST_DB_URL: postgresql://postgres@127.0.0.1:5432/postgres

name: Backfill Sources

# Manually dispatched, source-scoped season backfills -- e.g. loading
# historical seasons for a newly added endpoint without re-ingesting
# everything else. An explicit --sources scope keeps the per-game fan-outs
# (stats, plays, rosters) out of the run unless deliberately named; each
# season costs only what the named sources cost (ratings: ~6 calls/season).
# Marts refresh once at the end rather than once per season.
#
# Two sources -- coach_tenures (~350 per-team calls) and
# metrics_ppa_predicted (~120 calls) -- are run.py-only: they are
# deliberately excluded from load_season.py's SOURCE_ORDER (run.py:481-483,
# :570-576) and so have no dispatch path through the default `runner`
# below, which shells out to load_season.py and validates sources against
# that same SOURCE_ORDER. Dispatching with `runner: pipeline_run` bypasses
# that validation on purpose and calls src/pipelines/run.py directly for a
# single `--source` once, with no per-season loop -- and, because that path
# skips the trailing mart refresh, its `sources` input is restricted by an
# in-step allowlist to exactly coach_tenures and metrics_ppa_predicted;
# anything in load_season's SOURCE_ORDER (ratings, recruiting, stats, wepa,
# ...) must go through the default runner so its mart refresh still runs.
#
# Requires repo secrets:
#   CFBD_API_KEY    - collegefootballdata.com API key
#   SUPABASE_DB_URL - Supabase SESSION pooler URL (see daily-load.yml)

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: >-
          Season years, space-separated (e.g. 2016 2017 2018). Required
          when runner=load_season. Optional for runner=pipeline_run --
          pass years to resolve coach_tenures' team list from core.games;
          leave blank for metrics_ppa_predicted, which ignores years.
        required: false
        type: string
      sources:
        description: "Comma-separated sources for load_season.py --sources (e.g. ratings, or stats:player_returning); for runner=pipeline_run, a single run.py --source name (e.g. coach_tenures, metrics_ppa_predicted)"
        required: true
        type: string
      runner:
        description: "load_season: per-season loop via scripts/load_season.py (default). pipeline_run: single src.pipelines.run --source call, allowlisted to run.py-only sources not in load_season's SOURCE_ORDER (coach_tenures, metrics_ppa_predicted) -- any other source is rejected since this path skips the mart refresh."
        required: false
        type: choice
        default: load_season
        options:
          - load_season
          - pipeline_run

# Shares the daily load's concurrency group so a backfill never merges into
# the same tables while the scheduled load is mid-run; it queues instead.
concurrency:
  group: daily-season-load
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  SOURCES__CFBD__API_KEY: ${{ secrets.CFBD_API_KEY }}
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

jobs:
  backfill:
    name: Backfill ${{ inputs.sources }} for ${{ inputs.seasons || 'no seasons' }} (${{ inputs.runner || 'load_season' }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[compute]"
      - name: Set dlt destination credentials
        # dlt requires the postgres:// scheme (see .dlt/secrets.toml.example)
        run: echo "DESTINATION__POSTGRES__CREDENTIALS=$(printf '%s' "$SUPABASE_DB_URL" | sed 's/^postgresql:/postgres:/')" >> "$GITHUB_ENV"
      - name: Load seasons
        if: ${{ inputs.runner != 'pipeline_run' }}
        # Hardening (PR #75 review finding C): route workflow_dispatch inputs
        # through step-level env: vars (probe-endpoints.yml's pattern) rather
        # than interpolating ${{ inputs.* }} directly into the run: shell --
        # see historical-refresh.yml's Drain backlog step for the rationale.
        env:
          SEASONS_INPUT: ${{ inputs.seasons }}
          SOURCES_INPUT: ${{ inputs.sources }}
        run: |
          # runner=load_season always needs seasons -- fail fast with a
          # clear message rather than let the (empty) for-loop below
          # silently no-op.
          if [ -z "$SEASONS_INPUT" ]; then
            echo "::error::seasons is required when runner=load_season (leave it set, or switch runner to pipeline_run)"
            exit 1
          fi
          # $SEASONS_INPUT is deliberately unquoted -- it is a
          # space-separated list of years and this loop relies on the
          # shell's word-splitting to iterate them individually.
          for season in $SEASONS_INPUT; do
            echo "::group::Season $season"
            python scripts/load_season.py --season "$season" --sources "$SOURCES_INPUT" --skip-refresh
            echo "::endgroup::"
          done
      - name: Run pipeline source
        if: ${{ inputs.runner == 'pipeline_run' }}
        # run.py-only sources (coach_tenures, metrics_ppa_predicted) have no
        # SOURCE_ORDER slot in load_season.py, so this calls
        # src/pipelines/run.py directly, once, with no per-season loop --
        # unlike the load_season path above, which loops --season per year.
        env:
          SEASONS_INPUT: ${{ inputs.seasons }}
          SOURCES_INPUT: ${{ inputs.sources }}
        run: |
          # Allowlist: everything in load_season.py's SOURCE_ORDER already
          # has a correct dispatch path through the default runner (loops
          # seasons, refreshes marts at the end); letting one of those
          # sources through here would load data and leave its dependent
          # matviews silently stale, since this path skips the refresh
          # step unconditionally. Only coach_tenures and
          # metrics_ppa_predicted are run.py-only with no SOURCE_ORDER
          # slot -- and neither feeds any mart, which is what makes
          # skipping the refresh on this path safe, as long as this
          # allowlist holds. A future run.py-only source gets added here
          # deliberately, not implicitly.
          case "$SOURCES_INPUT" in
            coach_tenures|metrics_ppa_predicted) ;;
            *)
              echo "::error::runner=pipeline_run only supports the run.py-only sources coach_tenures and metrics_ppa_predicted -- '$SOURCES_INPUT' should go through the default load_season runner, which loops seasons and refreshes marts"
              exit 1
              ;;
          esac
          # metrics_ppa_predicted's runner lambda takes no arguments and
          # ignores years entirely, so it must run bare -- only append
          # --years when the seasons input is non-empty. coach_tenures
          # requires --years to resolve its team list from core.games via
          # scheduled_teams when --teams is not given (run.py:577-597).
          if [ -n "$SEASONS_INPUT" ]; then
            # $SEASONS_INPUT is deliberately unquoted here too -- same
            # space-separated word-splitting as the load_season loop above,
            # this time feeding argparse's `--years` nargs="+".
            python -m src.pipelines.run --source "$SOURCES_INPUT" --years $SEASONS_INPUT
          else
            python -m src.pipelines.run --source "$SOURCES_INPUT"
          fi
      - name: Refresh marts
        # Neither run.py-only source (coach_tenures, metrics_ppa_predicted)
        # feeds any mart, so skip the refresh entirely on that path rather
        # than pay for a no-op refresh.
        if: ${{ inputs.runner != 'pipeline_run' }}
        run: python scripts/refresh_marts.py

name: Deploy Schema

# Push-triggered schema deploys. Push-triggered workflows run from the pushed
# ref itself, so a deploy/** branch doesn't need to land on main first --
# see docs/plans/2026-07-19-tier1-analytics-unlock-plan.md ("Deploy mechanism").
#
# On push, scripts/deploy_schema.py reads deploy-manifest.json committed at
# the repo root of the deploy/** branch. workflow_dispatch is for human use
# once this workflow exists on main; it maps inputs to CLI flags instead.
#
# Requires repo secrets:
#   CFBD_API_KEY     - collegefootballdata.com API key
#   SUPABASE_DB_URL  - Supabase SESSION pooler URL (IPv4; the transaction
#                      pooler rejects the statement_timeout startup option
#                      that refresh_marts.py appends)

on:
  push:
    branches: ["deploy/**"]
  workflow_dispatch:
    inputs:
      action:
        description: "Deploy action"
        required: true
        type: choice
        options:
          - presence_check
          - apply
          - backfill
          - compute
          - managed_plan
          - managed_upgrade
          - managed_status
        default: presence_check
      mart_release:
        description: "Reviewed dependency-aware mart release manifest (apply only)"
        required: false
        type: string
      plan:
        description: "Read-only mart release dependency preview (requires mart_release)"
        required: false
        type: boolean
        default: false
      files:
        description: "Comma-separated SQL files for run_migrations.py --file (apply only)"
        required: false
        type: string
      refresh:
        description: "Refresh marts schema after apply"
        required: false
        type: boolean
        default: false
      backfill_start:
        description: "Backfill: first season, inclusive (backfill only)"
        required: false
        type: string
      backfill_end:
        description: "Backfill: last season, inclusive (backfill only)"
        required: false
        type: string
      sources:
        description: "Backfill: comma-separated pipeline sources, e.g. stats,betting (backfill only)"
        required: false
        type: string
      compute_script:
        description: "Compute script name, e.g. compute_house_elo (compute only)"
        required: false
        type: string
      compute_args:
        description: "Comma-separated args passed to the compute script (compute only)"
        required: false
        type: string

concurrency:
  # Recovery and standalone verification must read completed loads. Serialize
  # them with ingestion and historical refresh for the whole run, not just dispatch.
  group: ${{ (inputs.compute_script == 'recover_season_projections' || inputs.compute_script == 'verify_load') && 'daily-season-load' || 'deploy-schema' }}
  queue: max # preserve pending writers for whichever group this run selects
  cancel-in-progress: false # never kill a mid-deploy run; a queued run waits

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  SOURCES__CFBD__API_KEY: ${{ secrets.CFBD_API_KEY }}

jobs:
  deploy:
    name: Deploy schema
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[compute]"
      - name: Set dlt destination credentials
        if: github.event_name == 'push' || ! startsWith(inputs.action, 'managed_')
        # dlt requires the postgres:// scheme (see .dlt/secrets.toml.example)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: echo "DESTINATION__POSTGRES__CREDENTIALS=$(printf '%s' "$SUPABASE_DB_URL" | sed 's/^postgresql:/postgres:/')" >> "$GITHUB_ENV"
      - name: Deploy via manifest (push)
        if: github.event_name == 'push'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/deploy_schema.py --manifest deploy-manifest.json
      - name: Deploy via legacy CLI flags (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && ! startsWith(inputs.action, 'managed_')
        # Hardening (PR #75 review finding C): route every workflow_dispatch
        # input used below through a step-level env: var (probe-endpoints.yml's
        # pattern) rather than interpolating ${{ inputs.* }} directly into the
        # run: shell -- see historical-refresh.yml's Drain backlog step for
        # the rationale. The ARGS+=() accumulation and "$VAR" quoting are
        # unchanged; only where each value comes from moves.
        env:
          ACTION_INPUT: ${{ inputs.action }}
          MART_RELEASE_INPUT: ${{ inputs.mart_release }}
          PLAN_INPUT: ${{ inputs.plan }}
          FILES_INPUT: ${{ inputs.files }}
          REFRESH_INPUT: ${{ inputs.refresh }}
          BACKFILL_START_INPUT: ${{ inputs.backfill_start }}
          BACKFILL_END_INPUT: ${{ inputs.backfill_end }}
          SOURCES_INPUT: ${{ inputs.sources }}
          COMPUTE_SCRIPT_INPUT: ${{ inputs.compute_script }}
          COMPUTE_ARGS_INPUT: ${{ inputs.compute_args }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          ARGS=(--action "$ACTION_INPUT")
          if [ -n "$MART_RELEASE_INPUT" ]; then ARGS+=(--mart-release "$MART_RELEASE_INPUT"); fi
          if [ "$PLAN_INPUT" = "true" ]; then ARGS+=(--plan); fi
          if [ -n "$FILES_INPUT" ]; then ARGS+=(--files "$FILES_INPUT"); fi
          if [ "$REFRESH_INPUT" = "true" ]; then ARGS+=(--refresh); fi
          if [ -n "$BACKFILL_START_INPUT" ]; then ARGS+=(--backfill-start "$BACKFILL_START_INPUT"); fi
          if [ -n "$BACKFILL_END_INPUT" ]; then ARGS+=(--backfill-end "$BACKFILL_END_INPUT"); fi
          if [ -n "$SOURCES_INPUT" ]; then ARGS+=(--sources "$SOURCES_INPUT"); fi
          if [ -n "$COMPUTE_SCRIPT_INPUT" ]; then ARGS+=(--compute-script "$COMPUTE_SCRIPT_INPUT"); fi
          if [ -n "$COMPUTE_ARGS_INPUT" ]; then ARGS+=("--compute-args=$COMPUTE_ARGS_INPUT"); fi
          python scripts/deploy_schema.py "${ARGS[@]}"

      - name: Run managed production action
        id: managed_deploy
        if: github.event_name == 'workflow_dispatch' && startsWith(inputs.action, 'managed_')
        env:
          ACTION_INPUT: ${{ inputs.action }}
          MART_RELEASE_INPUT: ${{ inputs.mart_release }}
          PLAN_INPUT: ${{ inputs.plan }}
          FILES_INPUT: ${{ inputs.files }}
          REFRESH_INPUT: ${{ inputs.refresh }}
          BACKFILL_START_INPUT: ${{ inputs.backfill_start }}
          BACKFILL_END_INPUT: ${{ inputs.backfill_end }}
          SOURCES_INPUT: ${{ inputs.sources }}
          COMPUTE_SCRIPT_INPUT: ${{ inputs.compute_script }}
          COMPUTE_ARGS_INPUT: ${{ inputs.compute_args }}
          # The managed runner accepts this credential name only. Keep the
          # production secret scoped to the managed subprocess path.
          WAREHOUSE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          ARGS=(--action "$ACTION_INPUT")
          if [ -n "$MART_RELEASE_INPUT" ]; then ARGS+=(--mart-release "$MART_RELEASE_INPUT"); fi
          if [ "$PLAN_INPUT" = "true" ]; then ARGS+=(--plan); fi
          if [ -n "$FILES_INPUT" ]; then ARGS+=(--files "$FILES_INPUT"); fi
          if [ "$REFRESH_INPUT" = "true" ]; then ARGS+=(--refresh); fi
          if [ -n "$BACKFILL_START_INPUT" ]; then ARGS+=(--backfill-start "$BACKFILL_START_INPUT"); fi
          if [ -n "$BACKFILL_END_INPUT" ]; then ARGS+=(--backfill-end "$BACKFILL_END_INPUT"); fi
          if [ -n "$SOURCES_INPUT" ]; then ARGS+=(--sources "$SOURCES_INPUT"); fi
          if [ -n "$COMPUTE_SCRIPT_INPUT" ]; then ARGS+=(--compute-script "$COMPUTE_SCRIPT_INPUT"); fi
          if [ -n "$COMPUTE_ARGS_INPUT" ]; then ARGS+=("--compute-args=$COMPUTE_ARGS_INPUT"); fi
          python scripts/deploy_schema.py "${ARGS[@]}"

      - name: Observe managed status after upgrade attempt
        # This is a read-only observation, not a retry. The status runner takes
        # the same advisory lock as upgrade, and this step cannot erase a failed
        # managed_deploy outcome.
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.action == 'managed_upgrade' && steps.managed_deploy.outcome != 'skipped' }}
        env:
          WAREHOUSE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/deploy_schema.py --action managed_status

      - name: Upload schema-only catalog
        if: github.event_name == 'workflow_dispatch' && inputs.compute_script == 'export_warehouse_catalog'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: warehouse-catalog
          path: /tmp/warehouse-catalog/
          retention-days: 7
          if-no-files-found: error

      - name: Upload catalog adoption evidence
        if: github.event_name == 'workflow_dispatch' && inputs.compute_script == 'adopt_warehouse_catalog'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: warehouse-adoption
          path: /tmp/warehouse-adoption/
          retention-days: 7
          if-no-files-found: ignore
